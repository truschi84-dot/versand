<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handy-Vorschau — Tresch & Sohn</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Toolbar */
.toolbar { background: #16213e; border-bottom: 1px solid #0f3460; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0; }
.toolbar-title { font-weight: 700; font-size: 15px; color: #e2e8f0; margin-right: 4px; white-space: nowrap; }

.app-tabs { display: flex; gap: 4px; }
.app-tab { background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; white-space: nowrap; }
.app-tab:hover { border-color: #64748b; color: #e2e8f0; }
.app-tab.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }

.sep { width: 1px; height: 24px; background: #334155; flex-shrink: 0; }

.device-tabs { display: flex; gap: 4px; }
.device-btn { background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.15s; white-space: nowrap; }
.device-btn:hover { border-color: #64748b; color: #e2e8f0; }
.device-btn.active { background: #1e40af; border-color: #3b82f6; color: #fff; }

.btn-reload { background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.15s; }
.btn-reload:hover { border-color: #64748b; color: #e2e8f0; }

/* Stage */
.stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 20px; }

/* Phone frame */
.phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.phone-frame { background: #0f172a; border: 3px solid #334155; border-radius: 40px; padding: 12px; box-shadow: 0 0 0 1px #1e293b inset, 0 30px 80px rgba(0,0,0,0.6); position: relative; transition: width 0.2s, height 0.2s; }
.phone-notch { width: 80px; height: 20px; background: #0f172a; border-radius: 0 0 12px 12px; margin: 0 auto 6px; }
.phone-screen { background: #fff; border-radius: 24px; overflow: hidden; position: relative; }
.phone-screen iframe { display: block; border: none; width: 100%; height: 100%; }
.phone-home { width: 36px; height: 5px; background: #334155; border-radius: 3px; margin: 6px auto 0; }

/* Tablet notch (none) */
.tablet-mode .phone-notch { display: none; }
.tablet-mode .phone-frame { border-radius: 20px; padding: 10px; }
.tablet-mode .phone-screen { border-radius: 12px; }

.device-label { font-size: 12px; color: #64748b; text-align: center; }

/* Info bar */
.infobar { background: #0f172a; border-top: 1px solid #1e293b; padding: 6px 16px; display: flex; gap: 20px; font-size: 11px; color: #64748b; flex-shrink: 0; }
.infobar span b { color: #94a3b8; }
</style>
</head>
<body>

<div class="toolbar">
    <span class="toolbar-title">📱 Handy-Vorschau</span>

    <div class="app-tabs">
        <button class="app-tab active" onclick="loadApp('index.html', this)">Rechner-App</button>
        <button class="app-tab" onclick="loadApp('logistik/index.html', this)">Logistik-App</button>
        <button class="app-tab" onclick="loadApp('control/index.html', this)">Control Center</button>
    </div>

    <div class="sep"></div>

    <div class="device-tabs">
        <button class="device-btn active" onclick="setDevice(390,844,'iPhone 14',false,this)">iPhone 14</button>
        <button class="device-btn" onclick="setDevice(393,852,'iPhone 15 Pro',false,this)">iPhone 15 Pro</button>
        <button class="device-btn" onclick="setDevice(375,667,'iPhone SE',false,this)">iPhone SE</button>
        <button class="device-btn" onclick="setDevice(412,915,'Pixel 7',false,this)">Pixel 7</button>
        <button class="device-btn" onclick="setDevice(360,800,'Samsung S23',false,this)">Samsung S23</button>
        <button class="device-btn" onclick="setDevice(820,1180,'iPad Mini',true,this)">iPad Mini</button>
        <button class="device-btn" onclick="setDevice(1024,1366,'Fire HD 8',true,this)">Fire HD 8</button>
    </div>

    <div class="sep"></div>
    <button class="btn-reload" onclick="reloadFrame()" title="Neu laden">↺</button>
</div>

<div class="stage">
    <div class="phone-wrap" id="phoneWrap">
        <div class="phone-frame" id="phoneFrame">
            <div class="phone-notch" id="notch"></div>
            <div class="phone-screen" id="screen">
                <iframe id="previewFrame" src="index.html" allow="same-origin"></iframe>
            </div>
            <div class="phone-home" id="homeBar"></div>
        </div>
        <div class="device-label" id="deviceLabel">iPhone 14 · 390 × 844</div>
    </div>
</div>

<div class="infobar">
    <span>Gerät: <b id="info-device">iPhone 14</b></span>
    <span>Auflösung: <b id="info-res">390 × 844</b></span>
    <span>App: <b id="info-app">Rechner-App (index.html)</b></span>
    <span style="margin-left:auto;">Tipp: App wechseln → Rechner, Logistik oder Control Center anzeigen</span>
</div>

<script>
let currentW = 390, currentH = 844, isTablet = false, currentApp = 'index.html', currentDeviceName = 'iPhone 14';

function calcScale() {
    const stage = document.querySelector('.stage');
    const stageW = stage.clientWidth - 40;
    const stageH = stage.clientHeight - 40;
    const frameExtraW = isTablet ? 20 : 24;
    const frameExtraH = isTablet ? 20 : (12 + 20 + 6 + 5 + 6 + 24);
    const totalW = currentW + frameExtraW;
    const totalH = currentH + frameExtraH;
    const scaleW = stageW / totalW;
    const scaleH = stageH / totalH;
    return Math.min(scaleW, scaleH, 1);
}

function applyLayout() {
    const scale = calcScale();
    const frame = document.getElementById('phoneFrame');
    const screen = document.getElementById('screen');
    const iframe = document.getElementById('previewFrame');
    const wrap = document.getElementById('phoneWrap');
    const notch = document.getElementById('notch');
    const homeBar = document.getElementById('homeBar');

    if (isTablet) {
        frame.classList.add('tablet-mode');
        notch.style.display = 'none';
        homeBar.style.display = 'none';
    } else {
        frame.classList.remove('tablet-mode');
        notch.style.display = '';
        homeBar.style.display = '';
    }

    screen.style.width = currentW + 'px';
    screen.style.height = currentH + 'px';
    iframe.style.width = currentW + 'px';
    iframe.style.height = currentH + 'px';

    wrap.style.transform = 'scale(' + scale.toFixed(3) + ')';
    wrap.style.transformOrigin = 'center center';

    document.getElementById('deviceLabel').textContent = currentDeviceName + ' · ' + currentW + ' × ' + currentH;
    document.getElementById('info-device').textContent = currentDeviceName;
    document.getElementById('info-res').textContent = currentW + ' × ' + currentH;
}

function setDevice(w, h, name, tablet, btn) {
    currentW = w; currentH = h; currentDeviceName = name; isTablet = tablet;
    document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyLayout();
}

function loadApp(src, btn) {
    currentApp = src;
    document.getElementById('previewFrame').src = src;
    document.querySelectorAll('.app-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const names = { 'index.html': 'Rechner-App', 'logistik/index.html': 'Logistik-App', 'control/index.html': 'Control Center' };
    document.getElementById('info-app').textContent = (names[src] || src) + ' (' + src + ')';
}

function reloadFrame() {
    const f = document.getElementById('previewFrame');
    f.src = f.src;
}

window.addEventListener('resize', applyLayout);
applyLayout();
</script>
</body>
</html>
